<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Favicon (ícono de la pestaña) -->
    <link rel="icon" type="image/png" href="logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baterías Danna | Sunchales</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome para íconos -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0066cc;
            --lightning-yellow: #FFD700; /* Amarillo solicitado */
            --dark-bg: #111417;
            --light-bg: #f8f9fa;
        }

        body { font-family: 'Montserrat', sans-serif; color: #2d3436; background-color: #ffffff; }
        
        /* Navbar */
        .navbar-custom { background-color: var(--primary-color); padding: 12px 0; }
        .navbar-brand { font-weight: 900; color: #ffffff !important; display: flex; align-items: center; gap: 12px; }
        
        /* Logo: Círculo blanco con rayos amarillos */
        .brand-logo-container {
            width: 40px;
            height: 40px;
            background-color: #ffffff; /* Círculo blanco */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .brand-logo-svg {
            width: 30px;
            height: 30px;
            fill: var(--lightning-yellow); /* Rayos amarillos */
        }

        .navbar-custom .nav-link { color: #ffffff !important; font-weight: 700; text-transform: uppercase; margin: 0 10px; }
        
        /* Hero Section */
        .hero { background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1619642751034-765dfdf7c58e?auto=format&fit=crop&w=1200&q=80'); background-size: cover; padding: 140px 0; color: #ffffff; }
        .btn-custom-main { background-color: var(--primary-color); color: white; padding: 14px 32px; border-radius: 50px; font-weight: 900; }
        
        /* Servicios */
        .servicios-section { background-color: #0052a3; color: white; padding: 80px 0; }
        .service-card { background: white; color: #2d3436; border-radius: 16px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); height: 100%; }
        
        /* Contacto */
        .contacto-section { background-color: #111417; color: white; padding: 80px 0; }
        .btn-phone-float { position: fixed; bottom: 25px; right: 25px; background-color: var(--primary-color); color: white; border-radius: 50%; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <div class="brand-logo-container">
                    <!-- Rayos amarillos -->
                    <svg class="brand-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 40 15 L 25 50 L 45 50 L 35 85 L 65 45 L 45 45 Z" />
                        <path d="M 60 15 L 45 50 L 65 50 L 55 85 L 85 45 L 65 45 Z" />
                    </svg>
                </div>
                BATERÍAS DANNA
            </a>
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#inicio">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="#servicios">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contacto">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header id="inicio" class="hero text-center">
        <div class="container">
            <h1>Energía Confiable para tu Vehículo en Sunchales</h1>
            <p class="mt-3">Venta, instalación y diagnóstico de baterías.</p>
            <a href="tel:03493420100" class="btn btn-custom-main mt-4"><i class="fas fa-phone me-2"></i>Llamar al Taller</a>
        </div>
    </header>

    <section id="servicios" class="servicios-section text-center">
        <div class="container">
            <h2>Nuestros Servicios</h2>
            <div class="row g-4 mt-4">
                <div class="col-md-4"><div class="service-card"><h4>Carga</h4></div></div>
                <div class="col-md-4"><div class="service-card"><h4>Radiadores</h4></div></div>
                <div class="col-md-4"><div class="service-card"><h4>Domicilio</h4></div></div>
            </div>
        </div>
    </section>

    <section id="contacto" class="contacto-section text-center">
        <div class="container">
            <h3>Contacto</h3>
            <p>Sunchales, Santa Fe | Tel: 03493 - 420100</p>
        </div>
    </section>

    <a href="tel:03493420100" class="btn-phone-float"><i class="fas fa-phone"></i></a>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
